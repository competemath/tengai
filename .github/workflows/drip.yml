# The drip: anomalous-archangel studies the tree and acts on it (docs/anomalous-archangel.md). Scheduled, or by hand.
# It needs the repository secret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`, then `gh secret set CLAUDE_CODE_OAUTH_TOKEN -R competemath/tengai`).
# Without it the run says so and ends green: a missing secret is not a failed drip. A dry run needs no secret and spends nothing.
# Every Lean file the archangel writes passed the gate (lint, Leak IV, Lake with warnings as errors) before it was kept; the whole tree is
# gated once more here, and only then are the drip's files committed to main.
name: drip
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      budget_usd:
        description: "Dollars for the whole drip, conserved down the tree of angels"
        required: false
        default: "8"
      dry_run:
        description: "Fake agent, fake gate, a copy of the tree: nothing is spent and nothing is committed"
        type: boolean
        default: false
      latest_tengoku:
        description: "Move tengoku.pin to the newest published cache first, so the drip sees the newest Tengoku"
        type: boolean
        default: true
permissions: {}
concurrency:
  group: drip
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  drip:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions: { contents: write }   # commits the drip to main after the gate; the compile and the agents hold no secret but their own
    env:
      DRY: ${{ inputs.dry_run && 'true' || 'false' }}
      BUDGET: ${{ inputs.budget_usd || '8' }}
      LATEST: ${{ inputs.latest_tengoku != false && 'true' || 'false' }}
      TENGOKU_VERIFY: require
    steps:
      - name: Is there a token for the agents?
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ "$DRY" != true ] && [ -z "$TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=drip skipped::the repository secret CLAUDE_CODE_OAUTH_TOKEN is not set (claude setup-token; gh secret set CLAUDE_CODE_OAUTH_TOKEN -R $GITHUB_REPOSITORY)"
            echo "### Drip skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "The secret \`CLAUDE_CODE_OAUTH_TOKEN\` is not set, so there is no agent to run. Set it, or run with *dry_run*." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Free disk
        if: steps.token.outputs.skip != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/share/miniconda /usr/local/share/powershell /usr/local/lib/node_modules /opt/az /usr/local/graalvm /usr/local/share/chromium
          sudo docker image prune --all --force >/dev/null 2>&1 || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.skip != 'true'
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.token.outputs.skip != 'true'
        with: { python-version: "3.12" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.token.outputs.skip != 'true'
        with: { node-version: "22" }
      - name: The Claude CLI (pinned) and elan
        if: steps.token.outputs.skip != 'true'
        run: |
          npm install -g -q @anthropic-ai/claude-code@2.1.312
          claude --version
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Tengoku at the newest published cache (or at the pin)
        if: steps.token.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$LATEST" = true ]; then scripts/tengoku-setup.sh --latest; else scripts/tengoku-setup.sh; fi
      - name: The drip
        if: steps.token.outputs.skip != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ "$DRY" = true ]; then
            python -m anomalous_archangel drip --dry-run --budget "$BUDGET"
          else
            python -m anomalous_archangel drip --budget "$BUDGET"
          fi
      - name: The gate on the whole tree, once more, before anything is committed
        if: steps.token.outputs.skip != 'true' && env.DRY != 'true'
        run: python -m anomalous_archangel gate
      - name: Commit the drip to main
        if: steps.token.outputs.skip != 'true' && env.DRY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "anomalous-archangel[bot]"
          git config user.email "anomalous-archangel@users.noreply.github.com"
          git add Tengai Tengai.lean drips tengoku.pin
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          id="$(python -c 'import json; print(json.load(open("drips/index.json"))["drips"][0]["id"])')"
          git commit -q -s -m "drip $id" -m "Written by anomalous-archangel. Every Lean file passed the gate; the report is drips/$id/report.md."
          for _ in 1 2 3; do
            git pull -q --rebase "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main || true
            git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main && exit 0
          done
          echo "::error::could not push the drip"; exit 1
