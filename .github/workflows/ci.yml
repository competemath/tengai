# Tengai's gate on a pull request: every commit signed off, the Lean tree built with every warning an error, workflow syntax. `ci` is the one job to require.
# Nothing here has a secret, and nothing a PR supplies runs with a write token.
name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash   # -e -o pipefail
jobs:
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Every commit carries Signed-off-by (git commit -s)
        run: |
          bad=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            git log -1 --format=%B "$c" | grep -q '^Signed-off-by: ' || { echo "::error::$c has no Signed-off-by"; bad=1; }
          done
          exit $bad

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build (every warning is an error)
        run: lake build 2>&1 | tail -20
      - name: The canonical-form checker, on its fixtures and on the library (conventions.toml and TengaiCanon.lean list the same rules)
        run: |
          lake build tengai-canon TengaiFixtures 2>&1 | tail -20
          python3 tests/test_canon.py
      - name: The toolchain is the one the file names
        run: test "$(lake env lean --version | grep -o '4\.[0-9.]*\(-rc[0-9]*\)\?' | head -1)" = "$(sed 's/.*v//' lean-toolchain)"

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  ci:
    if: always()
    needs: [dco, lean, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every job passed (a skipped dco, on a push, is fine)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
