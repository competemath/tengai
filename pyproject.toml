[project]
name = "anomalous-archangel"
version = "1.0.0"
description = "The drip that studies Tengai as a working mathematician and is sovereign over it"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = [".lake", ".tengoku"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E701", "E702", "B007", "B023", "UP006", "UP007", "UP035", "UP045", "B008", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
