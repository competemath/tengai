name = "Fixture"
defaultTargets = ["Fx", "FxMd", "FxA", "FxB", "FxIdx"]

[[lean_lib]]
name = "Fx"

# a type with expression metadata between two binders (needs `import Lean`, so it is not exported: tests/test_replay.py reads it with tengai-extinfo in this project)
[[lean_lib]]
name = "FxMd"

# two modules with a private instance of the same user-facing name: exported together they collide in the registry of newly added constants of one replayed module
[[lean_lib]]
name = "FxA"

[[lean_lib]]
name = "FxB"

# an inductive family whose index is found by unfolding a definition: the kernel names the index binder of its recursor after the binder of the unfolded arrow, which the export (it shares terms that differ only in
# binder names) does not keep
[[lean_lib]]
name = "FxIdx"
