name = "Tengai"
version = "0.0.6"   # experimental: nothing at or above 1.0.0 before the owner's explicit approval (release-guard.toml, docs/release-barrier.md)
defaultTargets = ["Tengai"]

# Every warning is an error: a `sorry`, an unused variable and a deprecated name all stop the build. Tengai has no dependency (ADR-0001, invariant I3:
# it never imports Tengoku, and nothing else is needed yet); what it needs from Lean core it takes from Lean core.
[leanOptions]
warningAsError = true

[[lean_lib]]
name = "Tengai"

# The checker of the canonical form (conventions.toml, ADR-0004 invariant I2). It imports only Lean.
[[lean_exe]]
name = "tengai-canon"
root = "TengaiCanon"
supportInterpreter = true

# Fixtures of the checker: not a default target, built by tests/test_canon.py.
[[lean_lib]]
name = "TengaiFixtures"

# The normaliser of the canonical form: the three syntactic rules of conventions.toml applied to a file (idempotent, tests/test_normalise.py). It imports only Lean.
[[lean_exe]]
name = "tengai-normalise"
root = "TengaiNormalise"
supportInterpreter = true

# Content from a Tengoku export becomes a built `.olean` through the kernel (ADR-0005). It imports Lean; no library imports it.
[[lean_exe]]
name = "tengai-replay"
root = "TengaiReplay"
supportInterpreter = true

# What Lean keeps about a constant outside the kernel (reducibility, classes, instances, projection info), read where the constants came from and put back by `tengai-replay --ext`. It imports Lean.
[[lean_exe]]
name = "tengai-extinfo"
root = "TengaiExtInfo"
supportInterpreter = true
